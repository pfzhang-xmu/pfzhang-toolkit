name: XMU Gym

on:
  push:
    paths:
      - "projects/xmu-gym/**"
      - ".github/workflows/xmu-gym.yml"
  pull_request:
    paths:
      - "projects/xmu-gym/**"
      - ".github/workflows/xmu-gym.yml"
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: projects/xmu-gym
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Offline tests
        run: python -m pytest tests -q --ignore=tests/test_daily_ui.py
      - name: CLI smoke
        run: python -m app.cli info
