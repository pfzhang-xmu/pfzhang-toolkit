<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="XMU Gym">
  <defs>
    <clipPath id="disc"><circle cx="24" cy="24" r="23"/></clipPath>
    <radialGradient id="sky" cx="0.52" cy="0.18" r="1">
      <stop offset="0" stop-color="#7e9bcf"/>
      <stop offset="0.6" stop-color="#6482bb"/>
      <stop offset="1" stop-color="#4b689d"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#disc)">
    <circle cx="24" cy="24" r="23" fill="url(#sky)"/>
    <path d="M0 33c7-2.6 13-3.4 19.5-2.6 5 .6 8-1.4 10.4-5 1.6 3.2 1.6 7.2-.2 9.6H0z" fill="#a8bf66" opacity="0.5"/>
    <path d="M0 37.4c7.6-2.2 14-2.8 20.6-2.1 4.8.5 7.6-1.2 9.8-4.4 1.4 3 1.2 6.4-.4 8.6L0 40z" fill="#5c7734" opacity="0.7"/>
  </g>

  <g stroke="#2b2b25" stroke-width="1" stroke-linejoin="round" stroke-linecap="round">
    <!-- 脖子：纯白粗线，和身体、头融成一体（不加描边，否则接缝会露黑） -->
    <path d="M28.6 27.4c1.9-2.4 2.2-5.2 3.4-7.4 1-1.9 3.2-2.4 4.4-.9 1.1 1.4.6 3.5-1 4.7-1.5 1.1-3.3 1.6-4.6 2.3"
          fill="none" stroke="#fffdf7" stroke-width="3.4" stroke-linejoin="round"/>
    <!-- 身体 -->
    <path d="M13.4 30.6c-1.2-3 .3-5.8 3.6-6.9 3.4-1.1 7.4-.6 9.9 1.2 1.7 1.3 2 3.2.8 4.6-1.8 2.1-6.4 3.1-9.9 2.5-1.9-.3-3.7-.8-4.4-1.4z"
          fill="#fffdf7"/>
    <!-- 翅膀 -->
    <path d="M16.6 28.6c1.6-2.6 4.4-4.2 7.3-4.3-1 2.3-3.1 4-5.6 4.8z" fill="#eef0e6"/>
    <!-- 头 -->
    <circle cx="35.4" cy="17.6" r="2.7" fill="#fffdf7"/>
    <!-- 喙 -->
    <path d="M37.6 17.1 43.6 15.5 37.9 18.9z" fill="#e8a33c"/>
    <circle cx="36.2" cy="17.1" r="0.75" fill="#2b2b25" stroke="none"/>
    <!-- 腿 -->
    <path d="M21.4 33.6 19.8 40.6M24.6 33.4 23.6 40.8" stroke-width="1.5"/>
  </g>
  <circle cx="24" cy="24" r="22.4" fill="none" stroke="#2b2b25" stroke-opacity="0.26" stroke-width="1.1"/>
</svg>
